# Continuous integration for the Amadeus Agent Workbench monorepo.
#
# One job, run in dependency order so a type error fails fast before we pay for a
# browser download: install -> typecheck -> lint -> unit tests -> Playwright smoke.
# The smoke step boots the API + web dev servers itself via playwright.config.ts.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A newer push to the same branch/PR supersedes the running build.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Typecheck, lint, test, smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          # Caches ~/.npm keyed on package-lock.json so `npm ci` is mostly a link step.
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      # Browsers are cached by Playwright version so re-runs skip the ~120 MB download.
      - name: Resolve Playwright version
        id: pw
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        id: pw-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}

      - name: Install Chromium (with system deps)
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: npx -w apps/web playwright install --with-deps chromium

      # On a cache hit the browser binary is present but OS libraries may not be.
      - name: Install Chromium system deps only
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: npx -w apps/web playwright install-deps chromium

      - name: Playwright smoke tests
        run: npm run e2e
        env:
          CI: 'true'

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7
